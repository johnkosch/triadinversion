<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chord Inversions</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#202124;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:26px 18px 42px}h1{margin:0 0 6px;font-size:29px}.intro{margin:0 0 20px;color:#555}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 2px 8px #00000008}.prompt{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.key{font-size:25px;font-weight:650}.rn{font-size:34px;font-weight:700}.staff{width:100%;height:auto;display:block;background:white;border:1px solid #ddd;border-radius:9px;touch-action:manipulation}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:13px}button{font:inherit;padding:9px 13px;border:1px solid #bbb;border-radius:8px;background:white;cursor:pointer}button.primary{background:#202124;color:white;border-color:#202124}button:focus-visible{outline:3px solid #5598e8;outline-offset:2px}.acc{margin-left:auto;display:flex;align-items:center;gap:5px}.acc button{font-size:21px;min-width:43px}#feedback{font-weight:650;font-size:18px;min-height:28px;margin-top:14px}.good{color:#167139}.bad{color:#b42318}.hint{font-size:14px;color:#666;margin:9px 0 0}.stats{color:#666;font-size:14px;margin-left:auto}@media(max-width:600px){.card{padding:13px}.acc{margin-left:0}.stats{margin-left:0}.key{font-size:22px}}
</style></head><body><main class="wrap"><h1>Chord Inversions</h1><p class="intro">Spell the tonic triad in the indicated inversion. Stack the three notes vertically on the staff to show a chord.</p>
<section class="card"><div class="prompt"><div><div class="hint">KEY</div><div id="keyName" class="key">C major</div></div><div><div class="hint">ROMAN NUMERAL</div><div id="roman" class="rn">I</div></div><div class="stats" id="score">Correct: 0</div></div></section>
<section class="card"><h2 style="margin-top:0">Your chord</h2><canvas id="staff" class="staff" width="1000" height="330" aria-label="Interactive treble staff. Click to place notes. Select a note to edit it."></canvas><div class="controls"><button id="check" class="primary">Check Answer</button><button id="undo">Undo</button><button id="clear">Clear</button><div class="acc"><span>Accidental:</span><button data-acc="sharp" aria-label="Sharp">♯</button><button data-acc="flat" aria-label="Flat">♭</button><button data-acc="natural" aria-label="Natural">♮</button></div></div><div id="feedback" role="status" aria-live="polite"></div><div class="controls"><button id="new" class="primary">New Exercise</button><button id="show">Show Answer</button></div></section></main>
<script>
const canvas=document.getElementById('staff'),ctx=canvas.getContext('2d');const LETTERS=['C','D','E','F','G','A','B'],li={C:0,D:1,E:2,F:3,G:4,A:5,B:6},nat={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const keys=[
{name:'C major',tonic:'C',mode:'major',sig:{}},{name:'G major',tonic:'G',mode:'major',sig:{F:'sharp'}},{name:'D major',tonic:'D',mode:'major',sig:{F:'sharp',C:'sharp'}},{name:'A major',tonic:'A',mode:'major',sig:{F:'sharp',C:'sharp',G:'sharp'}},{name:'E major',tonic:'E',mode:'major',sig:{F:'sharp',C:'sharp',G:'sharp',D:'sharp'}},{name:'B major',tonic:'B',mode:'major',sig:{F:'sharp',C:'sharp',G:'sharp',D:'sharp',A:'sharp'}},{name:'F major',tonic:'F',mode:'major',sig:{B:'flat'}},{name:'B♭ major',tonic:'B',mode:'major',sig:{B:'flat',E:'flat'}},{name:'E♭ major',tonic:'E',mode:'major',sig:{B:'flat',E:'flat',A:'flat'}},{name:'A♭ major',tonic:'A',mode:'major',sig:{B:'flat',E:'flat',A:'flat',D:'flat'}},{name:'D♭ major',tonic:'D',mode:'major',sig:{B:'flat',E:'flat',A:'flat',D:'flat',G:'flat'}},{name:'F♯ major',tonic:'F',mode:'major',sig:{F:'sharp',C:'sharp',G:'sharp',D:'sharp',A:'sharp',E:'sharp'}}];
const minors=[{name:'A minor',tonic:'A',sig:{}},{name:'E minor',tonic:'E',sig:{F:'sharp'}},{name:'B minor',tonic:'B',sig:{F:'sharp',C:'sharp'}},{name:'F♯ minor',tonic:'F',sig:{F:'sharp',C:'sharp',G:'sharp'}},{name:'C♯ minor',tonic:'C',sig:{F:'sharp',C:'sharp',G:'sharp',D:'sharp'}},{name:'G♯ minor',tonic:'G',sig:{F:'sharp',C:'sharp',G:'sharp',D:'sharp',A:'sharp'}},{name:'D minor',tonic:'D',sig:{B:'flat'}},{name:'G minor',tonic:'G',sig:{B:'flat',E:'flat'}},{name:'C minor',tonic:'C',sig:{B:'flat',E:'flat',A:'flat'}},{name:'F minor',tonic:'F',sig:{B:'flat',E:'flat',A:'flat',D:'flat'}},{name:'B♭ minor',tonic:'B',sig:{B:'flat',E:'flat',A:'flat',D:'flat',G:'flat'}},{name:'E♭ minor',tonic:'E',sig:{B:'flat',E:'flat',A:'flat',D:'flat',G:'flat',C:'flat'}}].map(k=>({...k,mode:'minor'}));
const sharpOrder=['F','C','G','D','A','E','B'],flatOrder=['B','E','A','D','G','C','F'];let task,notes=[],selected=-1,score=0,nextTimer=null,currentClef='treble';
const spacing=38,topY=85,stepY=19,left=230,gap=250;
function rand(a){return a[Math.floor(Math.random()*a.length)]}function accVal(a){return a==='sharp'?1:a==='flat'?-1:0}function pitchMidi(p){return 12*(p.octave+1)+nat[p.name]+accVal(p.acc)}function staffAbs(p){return li[p.name]+7*p.octave}function yStep(s){return topY+4*spacing-s*stepY}function ref(){return currentClef==='treble'?li.E+7*4:li.G+7*2}function pitchAt(s,acc='natural'){let a=ref()+s;return{name:LETTERS[((a%7)+7)%7],octave:Math.floor(a/7),acc}}
function keyAcc(name){return task.key.sig[name]||'natural'}function accidentalFor(name){return keyAcc(name)}
function chordFor(k,inv){let tonic=li[k.tonic],rootOct=4;let root={name:k.tonic,octave:rootOct,acc:k.sig[k.tonic]||'natural'};let thirdName=LETTERS[(tonic+2)%7],fifthName=LETTERS[(tonic+4)%7];let thirdOct=rootOct+Math.floor((tonic+2)/7),fifthOct=rootOct+Math.floor((tonic+4)/7);let third={name:thirdName,octave:thirdOct,acc:k.sig[thirdName]||'natural'},fifth={name:fifthName,octave:fifthOct,acc:k.sig[fifthName]||'natural'};
// Minor tonic triads use a lowered third; in these natural-minor key signatures it is already diatonic.
if(k.mode==='minor') {let tonicPc=((nat[root.name]+accVal(root.acc))%12+12)%12;let thirdPc=(tonicPc+3)%12;let delta=((thirdPc-nat[third.name]+6)%12)-6;third.acc=delta===1?'sharp':delta===-1?'flat':delta===0?'natural':delta===2?'doubleSharp':delta===-2?'doubleFlat':'natural';}
let tones=[root,third,fifth], bass=tones[inv];return {tones,bass};}
function newTask(){if(nextTimer!==null){clearTimeout(nextTimer);nextTimer=null;}let key=rand([...keys,...minors]),inv=Math.floor(Math.random()*3);currentClef=rand(['treble','bass']);task={key,inv,...chordFor(key,inv)};document.getElementById('staff').setAttribute('aria-label',`Interactive ${currentClef} staff. Click to place notes. Select a note to edit it.`);notes=[];selected=-1;document.getElementById('keyName').textContent=key.name;document.getElementById('roman').innerHTML=(key.mode==='minor'?['i','i<sup>6</sup>','i<sup>6<sub>4</sub></sup>']:['I','I<sup>6</sup>','I<sup>6<sub>4</sub></sup>'])[inv];document.getElementById('feedback').textContent='';document.getElementById('feedback').className='';draw()}
function drawClef(){ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#111';if(currentClef==='treble'){ctx.font='240px serif';ctx.fillText('𝄞',75,topY+3*spacing-18)}else{ctx.font='204px serif';ctx.fillText('𝄢',75,topY+3*spacing-32)}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#222';ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(24,topY+i*spacing);ctx.lineTo(970,topY+i*spacing);ctx.stroke()}drawClef();
notes.forEach((p,i)=>{let step=staffAbs(p)-ref(),xx=500,yy=yStep(step);ctx.strokeStyle='#222';ctx.lineWidth=2;if(step<0)for(let s=-2;s>=step;s-=2){ctx.beginPath();ctx.moveTo(xx-24,yStep(s));ctx.lineTo(xx+24,yStep(s));ctx.stroke()}if(step>8)for(let s=10;s<=step;s+=2){ctx.beginPath();ctx.moveTo(xx-24,yStep(s));ctx.lineTo(xx+24,yStep(s));ctx.stroke()}if(i===selected){ctx.strokeStyle='#4285f4';ctx.lineWidth=3;ctx.beginPath();ctx.arc(xx,yy,25,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(xx,yy,16,10,-.35,0,Math.PI*2);ctx.fill();let a=p.acc||'natural';if(a!=='natural' || p.forceNatural){ctx.font='32px serif';ctx.textAlign='center';ctx.fillText(a==='sharp'?'♯':a==='flat'?'♭':a==='natural'?'♮':'',xx-30,yy)}})}
function canvasPoint(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.addEventListener('click',e=>{let q=canvasPoint(e);for(let i=0;i<notes.length;i++){let step=staffAbs(notes[i])-ref(),xx=500,yy=yStep(step);if(Math.hypot(q.x-xx,q.y-yy)<27){selected=i;draw();return}}if(notes.length>=3)return;let s=Math.round((topY+4*spacing-q.y)/stepY),p=pitchAt(s,'natural');notes.push(p);selected=notes.length-1;document.getElementById('feedback').textContent='';document.getElementById('feedback').className='';draw()});
document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{if(selected<0)return;notes[selected].acc=b.dataset.acc;notes[selected].forceNatural=b.dataset.acc==='natural';draw()});function move(d){if(selected<0)return;let s=staffAbs(notes[selected])-ref()+d,acc=notes[selected].acc;notes[selected]=pitchAt(s,acc);draw()}document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();move(1)}if(e.key==='ArrowDown'){e.preventDefault();move(-1)}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z')undo()});
function undo(){if(notes.length){notes.pop();selected=notes.length-1;draw()}}document.getElementById('undo').onclick=undo;document.getElementById('clear').onclick=()=>{notes=[];selected=-1;document.getElementById('feedback').textContent='';draw()};document.getElementById('new').onclick=newTask;
function sameSpelling(a,b){return a.name===b.name&&a.acc===b.acc}function check(){let f=document.getElementById('feedback');if(notes.length!==3){f.className='bad';f.textContent=`Enter three notes before checking. You have entered ${notes.length}.`;return}
// Require one occurrence of each correctly spelled chord tone, and the correct inversion's bass pitch class/spelling.
let wanted=task.tones;let matches=notes.every(n=>wanted.some(w=>sameSpelling(n,w)))&&wanted.every(w=>notes.some(n=>sameSpelling(n,w)));let bass=notes.reduce((a,b)=>pitchMidi(a)<=pitchMidi(b)?a:b);let bassOk=sameSpelling(bass,task.bass);if(matches&&bassOk){score++;document.getElementById('score').textContent='Correct: '+score;f.className='good';f.textContent='✓ Correct! Next exercise coming up…';nextTimer=setTimeout(()=>{nextTimer=null;newTask()},1200)}else{f.className='bad';f.textContent=!matches?'Not quite. Use exactly the three correctly spelled pitches of the tonic triad.':'The chord tones are right, but the lowest note is not the required bass note for this inversion.'}}
document.getElementById('check').onclick=check;document.getElementById('show').onclick=()=>{notes=task.tones.map((p,i)=>({...p,octave:p.octave+(i===task.inv?-1:0)}));selected=-1;draw();let f=document.getElementById('feedback');f.className='';f.textContent='One correct voicing is shown.'};newTask();
</script></body></html>
